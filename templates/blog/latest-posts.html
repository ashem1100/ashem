{% load static %}

    <div class="blog-sidebar-widget-inner shadow-box">
        <h3>پستهای اخیر</h3>
        {% for post in posts %}

            <ul>
                <li><a href="{% url 'blog:viewpost' id=post.id %}">{{ post.title }}</a></li>
            </ul>
            <br>
        {% endfor %}

    </div>
</div>
